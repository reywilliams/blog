<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">

  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="shell">
      {{ partial "layout/header.html" . }}
      <main id="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
      {{ partial "layout/footer.html" . }}
    </div>
  </body>
</html>
